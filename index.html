<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>深城职校园镇长</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:linear-gradient(135deg,#0d2b52,#1a4a8a 50%,#0d2b52);min-height:100vh;padding:20px;color:#333}
.wrap{max-width:1280px;margin:0 auto}
header{text-align:center;color:#fff;margin-bottom:16px}
header h1{font-size:26px;letter-spacing:2px}
header h1 .logo{color:#ff7a2f}
header p{font-size:13px;opacity:.8;margin-top:6px}
.card{background:#f5f6f8;border-radius:14px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.tip{text-align:center;font-size:13px;color:#555;margin-bottom:10px}
kbd{background:#0d2b52;color:#fff;border-radius:4px;padding:1px 6px;font-size:12px;margin:0 2px}

#stage{position:relative;width:100%;height:640px;overflow:hidden;border-radius:10px;background:#b9d3c4}
#campus{position:absolute;inset:0}

.building{position:absolute;border-radius:3px;cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.75);
  transition:transform .15s,box-shadow .15s}
.building:hover{transform:scale(1.06);box-shadow:0 5px 14px rgba(0,0,0,.45);z-index:20}
.building .bname{position:absolute;left:0;right:0;top:2px;text-align:center;
  font-size:10px;font-weight:bold;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.building .win{position:absolute;left:5px;right:5px;top:16px;bottom:5px;display:grid;gap:3px}
.building .win i{background:rgba(255,255,255,.55);border-radius:1px}

#player{position:absolute;width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff9a5a,#f2622d);
  box-shadow:0 3px 8px rgba(0,0,0,.45);z-index:50}
#player::before,#player::after{content:"";position:absolute;top:8px;width:4px;height:4px;background:#333;border-radius:50%}
#player::before{left:6px}#player::after{right:6px}

#label{position:absolute;z-index:60;background:#ff7a2f;color:#fff;padding:4px 10px;
  border-radius:6px;font-size:12px;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.3);display:none;white-space:nowrap}

#north{position:absolute;right:14px;top:14px;z-index:40;width:42px;height:42px;
  background:rgba(255,255,255,.94);border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:bold;color:#0d2b52;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#north::before{content:"▲";position:absolute;top:3px;font-size:10px;color:#e0392b}

#legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px;padding:12px 16px;
  background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#legend .lg{display:flex;align-items:center;gap:6px;font-size:12px;color:#555}
#legend .sw{width:24px;height:13px;border-radius:2px;border:1px solid rgba(0,0,0,.15)}
#legend h4{width:100%;font-size:13px;color:#0d2b52;margin-bottom:2px}

.status{display:flex;gap:12px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.pill{background:#fff;border-radius:20px;padding:8px 18px;font-size:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px}
.bar{width:110px;height:10px;background:#e3e6ea;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4caf50,#8bc34a);width:70%}

.event{background:#fff8ec;border-left:5px solid #ff7a2f;border-radius:10px;padding:16px;margin-top:6px}
.event h3{font-size:16px;color:#0d2b52;margin-bottom:6px}
.event .tag{background:#ff7a2f;color:#fff;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
.event p{font-size:13px;color:#666;line-height:1.8}
.btns{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:none;cursor:pointer;padding:9px 18px;border-radius:8px;font-size:13px;background:#0d2b52;color:#fff;transition:.15s}
.btn:hover{background:#1a4a8a;transform:translateY(-1px)}
.btn.warn{background:#ff7a2f}.btn.warn:hover{background:#ff9256}
#log{margin-top:12px;background:#fff;border-radius:10px;padding:12px;max-height:130px;overflow-y:auto;font-size:13px;line-height:1.9;color:#555}
#log div::before{content:"· ";color:#ff7a2f;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏫 深城职<span class="logo">校园镇长</span></h1>
    <p>深圳城市职业学院 · 先在校园里走走熟悉环境，再回到面板分配算力处理突发事务</p>
  </header>

  <div class="card">
    <div class="tip">🎮 点一下地图后用 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或 <kbd>方向键</kbd> 移动角色，走到建筑前会显示名称</div>

    <div id="stage">
      <svg id="campus" viewBox="0 0 1240 640" preserveAspectRatio="none">
        <!-- 校园外圈草地 -->
        <rect width="1240" height="640" fill="#b9d3c4"/>
        <!-- 外围道路 -->
        <path d="M60,90 L420,40 L760,60 L1180,150 L1200,520 L900,610 L300,600 L70,470 Z"
              fill="none" stroke="#9fb0a4" stroke-width="26" opacity=".5"/>

        <!-- ===== 分区 ===== -->
        <!-- 生活区（左，粉） -->
        <path d="M95,120 L330,95 L355,250 L340,420 L250,520 L120,470 L80,300 Z" fill="#f2cfc9"/>
        <!-- 文体活动区（左下，绿） -->
        <path d="M120,470 L250,520 L340,420 L470,455 L455,585 L280,590 Z" fill="#cfe0b8"/>
        <!-- 教学区（中，橙） -->
        <path d="M355,110 L700,95 L760,250 L745,470 L600,520 L470,455 L340,420 L355,250 Z" fill="#f7d9a4"/>
        <!-- 行政区（中上，紫） -->
        <path d="M520,70 L700,95 L690,190 L530,175 Z" fill="#d5c8ec"/>
        <!-- 环境美化区（右，浅绿） -->
        <path d="M760,110 L1090,170 L1120,470 L900,540 L745,470 L760,250 Z" fill="#dce8c6"/>

        <!-- 等高线（环境美化区） -->
        <g fill="none" stroke="#b6c99a" stroke-width="1.6" opacity=".85">
          <path d="M820,200 Q920,180 1030,220 Q1080,250 1060,300 Q980,330 890,300 Q820,260 820,200 Z"/>
          <path d="M850,230 Q930,215 1010,245 Q1045,265 1030,300 Q960,320 895,295 Q845,265 850,230 Z"/>
          <path d="M880,255 Q940,245 995,268 Q1015,282 1000,305 Q945,318 900,298 Q872,278 880,255 Z"/>
          <path d="M900,380 Q990,360 1070,400 Q1090,430 1050,455 Q960,470 905,435 Q885,405 900,380 Z"/>
          <path d="M930,400 Q995,388 1045,415 Q1055,432 1025,445 Q960,452 925,430 Z"/>
        </g>

        <!-- 明湖 -->
        <path d="M700,225 Q760,205 800,250 Q825,300 790,345 Q740,375 695,340 Q665,285 700,225 Z" fill="#8fc4e8"/>
        <path d="M712,250 Q755,235 785,268" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>
        <text x="745" y="300" text-anchor="middle" font-size="14" fill="#fff" style="text-shadow:0 1px 3px rgba(0,0,0,.35)">明湖</text>

        <!-- ===== 道路 ===== -->
        <!-- 东西主干道 -->
        <path d="M85,330 L1150,300" stroke="#cfd4d8" stroke-width="24" fill="none"/>
        <path d="M85,330 L1150,300" stroke="#fff" stroke-width="2" stroke-dasharray="14 12" fill="none"/>
        <!-- 南北主干道 -->
        <path d="M470,80 L455,590" stroke="#cfd4d8" stroke-width="22" fill="none"/>
        <path d="M470,80 L455,590" stroke="#fff" stroke-width="2" stroke-dasharray="14 12" fill="none"/>
        <!-- 环路 -->
        <path d="M330,150 Q600,120 720,200 Q780,290 730,420 Q600,490 430,450 Q330,380 330,150 Z"
              fill="none" stroke="#dfe3e6" stroke-width="14" opacity=".95"/>
        <!-- 支路 -->
        <path d="M745,300 L1090,290" stroke="#dfe3e6" stroke-width="12" fill="none"/>
        <path d="M600,520 L620,590" stroke="#dfe3e6" stroke-width="12" fill="none"/>
        <path d="M250,520 L280,590" stroke="#dfe3e6" stroke-width="10" fill="none"/>

        <!-- 树木 -->
        <g fill="#5a9e46">
          <circle cx="140" cy="180" r="11"/><circle cx="300" cy="200" r="9"/>
          <circle cx="110" cy="400" r="10"/><circle cx="200" cy="480" r="9"/>
          <circle cx="390" cy="540" r="10"/><circle cx="520" cy="560" r="9"/>
          <circle cx="660" cy="555" r="10"/><circle cx="820" cy="480" r="11"/>
          <circle cx="960" cy="200" r="10"/><circle cx="1060" cy="250" r="9"/>
          <circle cx="1080" cy="420" r="11"/><circle cx="880" cy="330" r="9"/>
          <circle cx="620" cy="150" r="9"/><circle cx="400" cy="180" r="10"/>
        </g>
      </svg>

      <div id="north">N</div>
      <div id="player"></div>
      <div id="label"></div>
    </div>

    <div id="legend">
      <h4>🗺️ 图例</h4>
      <div class="lg"><span class="sw" style="background:#f2cfc9"></span>生活区</div>
      <div class="lg"><span class="sw" style="background:#cfe0b8"></span>文体活动区</div>
      <div class="lg"><span class="sw" style="background:#f7d9a4"></span>教学区</div>
      <div class="lg"><span class="sw" style="background:#d5c8ec"></span>行政区</div>
      <div class="lg"><span class="sw" style="background:#dce8c6"></span>环境美化区</div>
      <div class="lg"><span class="sw" style="background:#8fc4e8"></span>水域</div>
      <div class="lg"><span class="sw" style="background:#cfd4d8"></span>道路</div>
      <div class="lg"><span class="sw" style="background:#e0392b"></span>教学楼</div>
      <div class="lg"><span class="sw" style="background:#3d6fb4"></span>实训楼</div>
      <div class="lg"><span class="sw" style="background:#e0a33e"></span>学生公寓</div>
    </div>

    <div class="status">
      <div class="pill">📅 回合 <b id="round">1</b> / 12</div>
      <div class="pill">⚡ 算力 <b id="power">100</b></div>
      <div class="pill">😊 满意度 <div class="bar"><i id="satBar"></i></div> <b id="sat">70</b></div>
    </div>

    <div class="event" id="eventBox"></div>
    <div id="log"></div>
  </div>
</div>

<script>
/* 建筑坐标严格对应真实地图相对位置（逻辑画布 1240x640） */
const BUILDINGS = [
  // 生活区（左）
  {name:'学生公寓A', x:120, y:150, w:78, h:56, c:'#e0a33e', cols:3},
  {name:'学生公寓B', x:215, y:145, w:78, h:56, c:'#e0a33e', cols:3},
  {name:'学生公寓C', x:120, y:225, w:78, h:56, c:'#e0a33e', cols:3},
  {name:'学生公寓D', x:215, y:220, w:78, h:56, c:'#e0a33e', cols:3},
  {name:'学生食堂',  x:150, y:360, w:105,h:56, c:'#e07b39', cols:4},
  // 文体活动区（左下）
  {name:'体育馆',    x:300, y:470, w:110,h:56, c:'#7a8fa6', cols:5},
  {name:'运动场',    x:330, y:330, w:95, h:70, c:'#4e9e3a', cols:0},
  // 教学区（中）
  {name:'A1教学楼',  x:560, y:330, w:82, h:62, c:'#e0392b', cols:3},
  {name:'A2教学楼',  x:560, y:225, w:82, h:62, c:'#e0392b', cols:3},
  {name:'B1教学楼',  x:660, y:225, w:72, h:56, c:'#e0392b', cols:3},
  {name:'B2教学楼',  x:660, y:330, w:72, h:56, c:'#e0392b', cols:3},
  {name:'B3教学楼',  x:620, y:420, w:72, h:56, c:'#e0392b', cols:3},
  {name:'信息学院大楼',x:400,y:225, w:95, h:72, c:'#3d6fb4', cols:4},
  {name:'实训楼',    x:400, y:330, w:85, h:56, c:'#3d6fb4', cols:3},
  {name:'图文中心',  x:520, y:105, w:115,h:56, c:'#2f5d9e', cols:4},
  {name:'图书楼',    x:400, y:140, w:85, h:56, c:'#2f5d9e', cols:3},
  // 行政区（中上）
  {name:'行政楼',    x:650, y:115, w:95, h:48, c:'#7a5fb5', cols:4},
  // 环境美化区（右）
  {name:'天琴阁',    x:900, y:200, w:78, h:52, c:'#8a9a5b', cols:3},
  {name:'创业学院',  x:830, y:400, w:95, h:52, c:'#c96a4a', cols:4},
  {name:'樱花园',    x:1000,y:330, w:70, h:48, c:'#d98ba8', cols:0},
];

const stage=document.getElementById('stage'), W=1240, H=640;
const player=document.getElementById('player'), label=document.getElementById('label');

function scale(){
  const rx=stage.clientWidth/W, ry=stage.clientHeight/H;
  document.querySelectorAll('.building').forEach((el,i)=>{
    const b=BUILDINGS[i];
    el.style.left=(b.x*rx)+'px'; el.style.top=(b.y*ry)+'px';
    el.style.width=(b.w*rx)+'px'; el.style.height=(b.h*ry)+'px';
  });
}

BUILDINGS.forEach(b=>{
  const el=document.createElement('div');
  el.className='building'; el.style.background=b.c;
  el.innerHTML=`<div class="bname">${b.name}</div>`+
    (b.cols?`<div class="win" style="grid-template-columns:repeat(${b.cols},1fr)"></div>`:'');
  if(b.cols){const w=el.querySelector('.win');for(let i=0;i<b.cols*2;i++)w.appendChild(document.createElement('i'));}
  el.onclick=()=>showLabel(b);
  stage.appendChild(el);
});
addEventListener('resize',scale);

let labelTimer=null;
function showLabel(b){
  const rx=stage.clientWidth/W, ry=stage.clientHeight/H;
  label.style.display='block';
  label.style.left=(b.x*rx)+'px';
  label.style.top=(b.y*ry-30)+'px';
  label.textContent='📍 '+b.name;
  clearTimeout(labelTimer);
  labelTimer=setTimeout(()=>label.style.display='none',2500);
}

let px=470, py=310, speed=7;
function draw(){
  const rx=stage.clientWidth/W, ry=stage.clientHeight/H;
  player.style.left=(px*rx)+'px'; player.style.top=(py*ry)+'px';
  let near=null;
  BUILDINGS.forEach(b=>{
    if(px>b.x-22&&px<b.x+b.w+22&&py>b.y-22&&py<b.y+b.h+22) near=b;
  });
  if(near&&!labelTimer){
    label.style.display='block';
    label.style.left=Math.min(px*rx,stage.clientWidth-140)+'px';
    label.style.top=(py*ry-32)+'px';
    label.textContent='📍 '+near.name;
  }else if(!labelTimer){label.style.display='none';}
}

const keys={};
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

setInterval(()=>{
  if(keys['w']||keys['arrowup'])py-=speed;
  if(keys['s']||keys['arrowdown'])py+=speed;
  if(keys['a']||keys['arrowleft'])px-=speed;
  if(keys['d']||keys['arrowright'])px+=speed;
  px=Math.max(20,Math.min(W-20,px));
  py=Math.max(20,Math.min(H-20,py));
  draw();
},30);
setTimeout(()=>{scale();draw();},50);

/* ===== 游戏逻辑 ===== */
let round=1,power=100,sat=70;
const EVENTS=[
  {t:'选课系统卡顿',tag:'学习助手 Agent',d:'选课开放瞬间流量暴涨，页面频繁超时。',cost:35,gain:8},
  {t:'实训楼设备报修',tag:'智慧后勤',d:'实训楼多间实训室设备故障，学生实训进度受阻。',cost:25,gain:6},
  {t:'迎新季人流高峰',tag:'人流调度',d:'新生报到日，学生公寓与食堂周边人流密集。',cost:30,gain:7},
  {t:'技能大赛筹备',tag:'赛事保障',d:'省级职业院校技能大赛即将在校举办，需保障网络与场地。',cost:40,gain:10},
  {t:'图书楼座位紧张',tag:'空间优化',d:'期末周图书楼一座难求，学生投诉增多。',cost:20,gain:5},
  {t:'食堂排队过长',tag:'餐饮调度',d:'午高峰学生食堂排队超过 20 分钟。',cost:22,gain:6},
  {t:'公寓网络投诉',tag:'网络运维',d:'学生公寓晚间网络带宽不足。',cost:28,gain:7},
  {t:'创业学院路演',tag:'活动支持',d:'创业学院举办项目路演，需要直播与算力支持。',cost:18,gain:5},
  {t:'体育馆排期冲突',tag:'排期协调',d:'社团活动与体育课场地时间冲突。',cost:15,gain:4},
  {t:'明湖周边保洁',tag:'环境维护',d:'明湖沿岸落叶堆积，影响校园环境美观。',cost:12,gain:4},
];
const box=document.getElementById('eventBox'), log=document.getElementById('log');

function renderStatus(){
  document.getElementById('round').textContent=round;
  document.getElementById('power').textContent=power;
  document.getElementById('sat').textContent=sat;
  document.getElementById('satBar').style.width=sat+'%';
}
function addLog(s){const d=document.createElement('div');d.textContent=s;log.prepend(d);}
function nextEvent(){
  if(round>12){
    box.innerHTML=`<h3>🎉 任期结束</h3><p>最终满意度：<b>${sat}</b> 分。${
      sat>=90?'你是深城职史上最受爱戴的镇长！':sat>=70?'校园运行平稳，师生评价不错。':'校园问题较多，下学期要加油了。'}</p>`;
    return;
  }
  const e=EVENTS[Math.floor(Math.random()*EVENTS.length)];
  box.innerHTML=`
    <h3>📌 ${e.t}<span class="tag">建议：${e.tag}</span></h3>
    <p>${e.d}</p>
    <p style="margin-top:6px">处理该事件建议投入 <b style="color:#ff7a2f">${e.cost}</b> 点算力，预计满意度 +${e.gain}</p>
    <div class="btns">
      <button class="btn warn" onclick="handle(${e.cost},${e.gain},'${e.t}')">✅ 投入算力处理</button>
      <button class="btn" onclick="skip('${e.t}')">⏭️ 暂时搁置</button>
    </div>`;
}
window.handle=(cost,gain,t)=>{
  if(power<cost)addLog(`⚠️ 算力不足，无法处理「${t}」`);
  else{power-=cost;sat=Math.min(100,sat+gain);addLog(`✅ 已处理「${t}」，消耗 ${cost} 算力，满意度 +${gain}`);}
  round++;power+=20;renderStatus();nextEvent();
};
window.skip=t=>{sat=Math.max(0,sat-6);addLog(`❌ 搁置「${t}」，满意度 -6`);round++;power+=20;renderStatus();nextEvent();};

renderStatus();nextEvent();
</script>
</body>
</html>
