<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园小镇镇长 · 多智能体经营</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    margin: 0; padding: 20px; min-height: 100vh; color: #333;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { text-align: center; color: #fff; margin: 0 0 6px; font-size: 26px; }
  .sub { text-align: center; color: rgba(255,255,255,.85); margin-bottom: 18px; font-size: 14px; }

  /* ===== 俯视角地图 ===== */
  .map-panel {
    background:#fff; border-radius:14px; padding:14px; margin-bottom:16px;
    box-shadow:0 6px 20px rgba(0,0,0,.2); position:relative;
  }
  .map-hint { font-size:13px; color:#666; text-align:center; margin-bottom:8px; }
  .map-hint b { color:#5c6bc0; }
  #townMap {
    display:block; width:100%; height:auto; border-radius:10px;
    background:#79c46a; outline:none; cursor:pointer;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.08);
  }
  #locBanner {
    position:absolute; left:50%; transform:translateX(-50%); bottom:18px;
    background:rgba(0,0,0,.72); color:#fff; padding:7px 16px; border-radius:20px;
    font-size:14px; pointer-events:none; opacity:0; transition:opacity .2s;
  }
  #locBanner.show { opacity:1; }
  #locBanner .k { color:#ffd54f; font-weight:bold; }

  .hud { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
  .hud div {
    background: rgba(255,255,255,.95); padding: 10px 18px; border-radius: 10px;
    font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .bar { width: 120px; height: 10px; background: #ddd; border-radius: 5px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .bar > i { display: block; height: 100%; background: #4caf50; transition: width .4s; }

  .panel { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 6px 20px rgba(0,0,0,.2); margin-bottom: 16px; }
  .event { background: #fff8e1; border-left: 5px solid #ffa726; padding: 14px 16px; border-radius: 8px; margin-bottom: 18px; }
  .event h3 { margin: 0 0 6px; font-size: 18px; }
  .event p { margin: 0; color: #666; font-size: 14px; line-height: 1.6; }
  .tag { display: inline-block; background: #ff7043; color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }

  .agents { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .card { border: 2px solid #e0e0e0; border-radius: 12px; padding: 16px; text-align: center; transition: .2s; }
  .card.on { border-color: #4caf50; background: #f1f8e9; }
  .card .ico { font-size: 34px; }
  .card h4 { margin: 8px 0 4px; }
  .card .desc { font-size: 12px; color: #888; min-height: 32px; }
  .ctrl { margin-top: 10px; }
  .ctrl button { width: 34px; height: 34px; border: none; border-radius: 50%; background: #667eea; color: #fff; font-size: 18px; cursor: pointer; }
  .ctrl button:disabled { background: #ccc; cursor: not-allowed; }
  .ctrl span { font-size: 20px; font-weight: bold; margin: 0 12px; }

  .btn { display: block; width: 100%; padding: 14px; margin-top: 18px; border: none; border-radius: 10px; background: #4caf50; color: #fff; font-size: 17px; cursor: pointer; }
  .btn:hover { background: #43a047; }
  .btn:disabled { background: #aaa; cursor: not-allowed; }
  .btn.sec { background: #90a4ae; margin-top: 10px; }

  #log { max-height: 160px; overflow-y: auto; font-size: 13px; line-height: 1.8; }
  #log div { border-bottom: 1px dashed #eee; padding: 3px 0; }
  .up { color: #2e7d32; font-weight: bold; }
  .down { color: #c62828; font-weight: bold; }
  .over { text-align: center; padding: 30px; }
  .over h2 { font-size: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏫 校园小镇镇长</h1>
  <p class="sub">先在小镇里走走熟悉校园，再回到面板分配算力处理突发事务</p>

  <!-- ===== 俯视角小镇地图 ===== -->
  <div class="map-panel">
    <div class="map-hint">🎮 点一下地图后用 <b>W A S D</b> 或 <b>方向键</b> 移动角色，走到建筑前会显示名称</div>
    <canvas id="townMap" width="920" height="540" tabindex="0"></canvas>
    <div id="locBanner"></div>
  </div>

  <div class="hud">
    <div>回合 <b id="round">1</b> / 12</div>
    <div>算力 <b id="power">100</b></div>
    <div>满意度 <span class="bar"><i id="satBar" style="width:70%"></i></span> <b id="sat">70</b></div>
  </div>

  <div class="panel" id="gameArea">
    <div class="event" id="eventBox"></div>
    <div class="agents" id="agents"></div>
    <button class="btn" id="goBtn" onclick="settle()">✅ 提交分配，处理事件</button>
    <button class="btn sec" onclick="reset()">🔄 重新开始</button>
  </div>

  <div class="panel">
    <h4 style="margin-top:0">📋 小镇日志</h4>
    <div id="log"></div>
  </div>
</div>

<script>
/* ================= 俯视角小镇地图 ================= */
(function(){
  const cv = document.getElementById('townMap');
  const ctx = cv.getContext('2d');
  const banner = document.getElementById('locBanner');
  const VIEW_W = cv.width, VIEW_H = cv.height;
  const WORLD_W = 1700, WORLD_H = 1200;
  const TILE = 40;

  const BUILDINGS = [
    { name:'教学楼',   agent:'学习助手', x:360, y:120, w:380, h:230, color:'#8d99ae', roof:'#5c677d', icon:'🏫' },
    { name:'图书馆',   agent:'学习助手', x:920, y:120, w:320, h:230, color:'#a3b18a', roof:'#588157', icon:'📚' },
    { name:'食堂',     agent:'生活服务', x:140, y:520, w:300, h:210, color:'#f4a261', roof:'#e76f51', icon:'🍔' },
    { name:'学生宿舍', agent:'生活服务', x:1120,y:540, w:360, h:250, color:'#e9c46a', roof:'#c98b1b', icon:'🛏' },
    { name:'社团中心', agent:'社交协同', x:360, y:860, w:320, h:210, color:'#b5838d', roof:'#7d4a55', icon:'🎭' },
    { name:'行政楼',   agent:'社交协同', x:1120,y:880, w:320, h:200, color:'#6a8caf', roof:'#3d5a73', icon:'🏛' }
  ];
  const FIELD = { cx:880, cy:980, rx:230, ry:150, name:'操场' };
  const POND  = { cx:760, cy:430, rx:120, ry:80 };

  const TREES = [];
  (function seedTrees(){
    let s = 12345;
    const rnd = ()=> (s = (s*1103515245+12345)&0x7fffffff)/0x7fffffff;
    for(let i=0;i<80;i++){
      const x = rnd()*WORLD_W, y = rnd()*WORLD_H;
      if(inBuilding(x,y)||inField(x,y)||inPond(x,y)) continue;
      TREES.push({x,y,r:12+rnd()*8});
    }
  })();

  const player = { x:820, y:700, r:14, speed:4.4 };
  const keys = {};
  let facing = 'down';

  function inBuilding(x,y,pad){ pad=pad||0;
    return BUILDINGS.some(b=> x> b.x-pad && x < b.x+b.w+pad && y> b.y-pad && y < b.y+b.h+pad );
  }
  function inField(x,y){ const dx=(x-FIELD.cx)/FIELD.rx, dy=(y-FIELD.cy)/FIELD.ry; return dx*dx+dy*dy <= 1; }
  function inPond(x,y,pad){ pad=pad||0; const dx=(x-POND.cx)/(POND.rx+pad), dy=(y-POND.cy)/(POND.ry+pad); return dx*dx+dy*dy <= 1; }
  function blocked(x,y){
    if(x<player.r||y<player.r||x>WORLD_W-player.r||y>WORLD_H-player.r) return true;
    if(inBuilding(x,y,player.r-2)) return true;
    if(inPond(x,y,player.r-2)) return true;
    return false;
  }

  window.addEventListener('keydown', e=>{
    const k=e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)||['w','a','s','d'].includes(k)) e.preventDefault();
    keys[k]=true;
  });
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });
  cv.addEventListener('mousedown', ()=> cv.focus());

  function nearBuilding(){
    const cx=player.x, cy=player.y, pad=34;
    for(const b of BUILDINGS){
      if(cx>b.x-pad && cx<b.x+b.w+pad && cy>b.y-pad && cy<b.y+b.h+pad) return b.name+'（'+b.agent+' Agent 负责）';
    }
    const d=Math.hypot(cx-FIELD.cx,cy-FIELD.cy);
    if(d<FIELD.rx+pad) return FIELD.name;
    return null;
  }

  function update(){
    let dx=0, dy=0;
    if(keys['w']||keys['arrowup'])    dy-=1;
    if(keys['s']||keys['arrowdown'])  dy+=1;
    if(keys['a']||keys['arrowleft'])  dx-=1;
    if(keys['d']||keys['arrowright']) dx+=1;
    if(dx&&dy){ const n=Math.SQRT1_2; dx*=n; dy*=n; }
    if(dx||dy){
      if(dx>0.3) facing='right'; else if(dx<-0.3) facing='left';
      else if(dy>0) facing='down'; else facing='up';
      const nx=player.x+dx*player.speed, ny=player.y+dy*player.speed;
      if(!blocked(nx,player.y)) player.x=nx;
      if(!blocked(player.x,ny))  player.y=ny;
    }
    const nb=nearBuilding();
    if(nb){ banner.innerHTML='📍 当前位置：<span class="k">'+nb+'</span>'; banner.classList.add('show'); }
    else banner.classList.remove('show');
  }

  function cam(){
    let cx=player.x-VIEW_W/2, cy=player.y-VIEW_H/2;
    cx=Math.max(0,Math.min(WORLD_W-VIEW_W,cx));
    cy=Math.max(0,Math.min(WORLD_H-VIEW_H,cy));
    return {cx,cy};
  }

  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  function draw(){
    const c=cam();
    ctx.save();
    ctx.fillStyle='#7ec96a'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
    ctx.translate(-c.cx,-c.cy);

    ctx.fillStyle='rgba(255,255,255,.06)';
    const gx0=Math.floor(c.cx/TILE)*TILE, gy0=Math.floor(c.cy/TILE)*TILE;
    for(let x=gx0;x<c.cx+VIEW_W;x+=TILE)
      for(let y=gy0;y<c.cy+VIEW_H;y+=TILE)
        if(((x+y)/TILE)%2===0) ctx.fillRect(x,y,TILE,TILE);

    ctx.fillStyle='#cfcfcf';
    ctx.fillRect(0,560,WORLD_W,120);
    ctx.fillRect(820,0,120,WORLD_H);
    ctx.strokeStyle='#f4f4f4'; ctx.lineWidth=4; ctx.setLineDash([26,22]);
    ctx.beginPath(); ctx.moveTo(0,620); ctx.lineTo(WORLD_W,620); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(880,0); ctx.lineTo(880,WORLD_H); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle='#5aa9e6';
    ctx.beginPath(); ctx.ellipse(POND.cx,POND.cy,POND.rx,POND.ry,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(POND.cx-30,POND.cy-20,POND.rx*0.4,POND.ry*0.3,0,0,7); ctx.fill();

    ctx.fillStyle='#e07a5f';
    ctx.beginPath(); ctx.ellipse(FIELD.cx,FIELD.cy,FIELD.rx,FIELD.ry,0,0,7); ctx.fill();
    ctx.strokeStyle='#f1faee'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.ellipse(FIELD.cx,FIELD.cy,FIELD.rx-18,FIELD.ry-18,0,0,7); ctx.stroke();
    ctx.fillStyle='#4a7c59';
    ctx.beginPath(); ctx.ellipse(FIELD.cx,FIELD.cy,FIELD.rx-55,FIELD.ry-55,0,0,7); ctx.fill();

    for(const b of BUILDINGS){
      ctx.fillStyle='rgba(0,0,0,.18)'; rr(b.x+6,b.y+10,b.w,b.h,10); ctx.fill();
      ctx.fillStyle=b.color; rr(b.x,b.y,b.w,b.h,10); ctx.fill();
      ctx.fillStyle=b.roof; rr(b.x,b.y,b.w,46,10); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='26px serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(b.icon,b.x+14,b.y+24);
      ctx.fillStyle='#fff'; ctx.font='bold 22px "Microsoft YaHei"'; ctx.textAlign='left';
      ctx.fillText(b.name,b.x+52,b.y+24);
      ctx.fillStyle='rgba(255,255,255,.55)';
      const cols=Math.floor((b.w-30)/44), rows=Math.floor((b.h-90)/48);
      for(let i=0;i<cols;i++)for(let j=0;j<rows;j++)
        ctx.fillRect(b.x+20+i*44,b.y+62+j*48,26,30);
    }

    for(const t of TREES){
      ctx.fillStyle='rgba(0,0,0,.15)';
      ctx.beginPath(); ctx.ellipse(t.x+3,t.y+t.r*0.7,t.r*0.8,t.r*0.4,0,0,7); ctx.fill();
      ctx.fillStyle='#2f6b3a'; ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,7); ctx.fill();
      ctx.fillStyle='#3f8a4c'; ctx.beginPath(); ctx.arc(t.x-t.r*0.3,t.y-t.r*0.3,t.r*0.6,0,7); ctx.fill();
    }

    ctx.fillStyle='rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(player.x,player.y+player.r*0.8,player.r*0.9,player.r*0.4,0,0,7); ctx.fill();
    ctx.fillStyle='#ff8a5c'; ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,7); ctx.fill();
    ctx.strokeStyle='#d9552c'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.fillStyle='#333';
    let ex=0,ey=0;
    if(facing==='down') ey=4; else if(facing==='up') ey=-4;
    else if(facing==='right'){ex=4;} else {ex=-4;}
    ctx.beginPath(); ctx.arc(player.x-5+ex,player.y-2+ey,2.4,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(player.x+5+ex,player.y-2+ey,2.4,0,7); ctx.fill();

    ctx.restore();

    const mw=150, mh=106, mx=VIEW_W-mw-12, my=12;
    ctx.fillStyle='rgba(255,255,255,.85)'; rr(mx-4,my-4,mw+8,mh+8,8); ctx.fill();
    ctx.strokeStyle='#999'; ctx.lineWidth=1; ctx.stroke();
    const sx=mw/WORLD_W, sy=mh/WORLD_H;
    ctx.fillStyle='#7ec96a'; ctx.fillRect(mx,my,mw,mh);
    ctx.fillStyle='#5aa9e6'; ctx.beginPath(); ctx.ellipse(mx+POND.cx*sx,my+POND.cy*sy,POND.rx*sx,POND.ry*sy,0,0,7); ctx.fill();
    ctx.fillStyle='#e07a5f'; ctx.beginPath(); ctx.ellipse(mx+FIELD.cx*sx,my+FIELD.cy*sy,FIELD.rx*sx,FIELD.ry*sy,0,0,7); ctx.fill();
    ctx.fillStyle='#5c677d';
    for(const b of BUILDINGS) ctx.fillRect(mx+b.x*sx,my+b.y*sy,b.w*sx,b.h*sy);
    ctx.fillStyle='#ff2d55'; ctx.beginPath(); ctx.arc(mx+player.x*sx,my+player.y*sy,3,0,7); ctx.fill();
  }

  function loop(){ update(); draw(); requestAnimationFrame(loop); }
  loop();
})();

/* ================= 智能体经营玩法（原逻辑保留） ================= */
const AGENTS = [
  { key:'study', name:'学习助手 Agent', icon:'📚', desc:'图书馆、自习室、课程与考试相关' },
  { key:'life',  name:'生活服务 Agent', icon:'🍔', desc:'食堂、宿舍、外卖与后勤相关' },
  { key:'social',name:'社交协同 Agent', icon:'🤝', desc:'社团、活动、通知与舆情相关' }
];

const EVENTS = [
  { t:'图书馆爆满', d:'期末临近，图书馆座位全满，学生在门口排长队。', tag:'study', need:30 },
  { t:'食堂排队过长', d:'中午高峰窗口不足，排队超过 20 分钟，投诉激增。', tag:'life', need:30 },
  { t:'宿舍网络中断', d:'3 号宿舍楼断网 2 小时，学生无法上网课。', tag:'life', need:35 },
  { t:'社团招新混乱', d:'百团大战现场人流拥挤，报名系统崩溃。', tag:'social', need:25 },
  { t:'选课系统卡顿', d:'选课开放瞬间流量暴涨，页面频繁超时。', tag:'study', need:35 },
  { t:'校园活动无人问津', d:'讲座宣传不到位，到场人数不足预期三成。', tag:'social', need:20 },
  { t:'作业批改积压', d:'助教人手不足，作业批改延迟一周。', tag:'study', need:25 },
  { t:'外卖配送超时', d:'雨天运力不足，大量订单超时未送达。', tag:'life', need:30 },
  { t:'新生适应困难', d:'新生对校园流程不熟悉，咨询量暴增。', tag:'social', need:25 },
  { t:'自习室占座纠纷', d:'占座现象严重，学生之间产生冲突。', tag:'study', need:20 },
  { t:'食堂卫生投诉', d:'有学生反映餐品卫生问题，需紧急排查。', tag:'life', need:35 },
  { t:'校园舆情发酵', d:'一条吐槽帖在校内论坛快速传播，需及时回应。', tag:'social', need:30 }
];

let S = {};

function reset(){
  S = { round:1, power:100, sat:70, alloc:{study:0,life:0,social:0}, event:null, over:false };
  pickEvent();
  render();
  document.getElementById('log').innerHTML = '';
  log('🎬 你上任成为小镇镇长，开始管理校园智能体。');
}

function pickEvent(){
  S.event = EVENTS[Math.floor(Math.random()*EVENTS.length)];
  S.alloc = {study:0,life:0,social:0};
  S.power = 100;
}

function change(key, delta){
  const v = S.alloc[key] + delta;
  const total = S.alloc.study + S.alloc.life + S.alloc.social;
  if (v < 0) return;
  if (delta > 0 && total >= S.power) return;
  S.alloc[key] = v;
  render();
}

function settle(){
  if (S.over) return;
  const used = S.alloc.study + S.alloc.life + S.alloc.social;
  if (used === 0){ alert('请至少分配 1 点算力'); return; }

  const main = S.event.tag;
  const mainPower = S.alloc[main];
  const other = used - mainPower;
  let delta = 0, msg = '';

  if (mainPower >= S.event.need){
    delta = 10 + Math.floor((mainPower - S.event.need)/5);
    msg = `✅ ${S.event.t} 处理顺利，${name(main)} 高效完成任务`;
  } else if (mainPower > 0){
    delta = -5 + other;
    msg = `⚠️ ${S.event.t} 算力不足，勉强应付，仍有遗留问题`;
  } else {
    delta = -15 + Math.floor(other/3);
    msg = `❌ ${S.event.t} 无人处理，问题恶化`;
  }

  const idle = S.power - used;
  if (idle > 60) delta -= 3;

  S.sat = Math.max(0, Math.min(100, S.sat + delta));
  log(`${msg} <span class="${delta>=0?'up':'down'}">满意度 ${delta>=0?'+':''}${delta}</span>`);

  if (S.sat <= 0){
    S.over = true; render();
    document.getElementById('gameArea').innerHTML =
      `<div class="over"><h2>😞 小镇满意度归零</h2><p>你被师生们投下了不信任票，任期结束于第 ${S.round} 回合。</p>
       <button class="btn" onclick="reset()">🔄 再来一次</button></div>`;
    return;
  }

  if (S.round >= 12){
    S.over = true; render();
    const grade = S.sat >= 90 ? 'S 级 · 传奇镇长' : S.sat >= 75 ? 'A 级 · 优秀镇长' : S.sat >= 60 ? 'B 级 · 合格镇长' : 'C 级 · 勉强留任';
    document.getElementById('gameArea').innerHTML =
      `<div class="over"><h2>🎉 任期圆满结束！</h2><p>最终满意度：<b>${S.sat}</b> 分</p><p>评价：<b>${grade}</b></p>
       <button class="btn" onclick="reset()">🔄 再玩一次</button></div>`;
    return;
  }

  S.round++;
  pickEvent();
  render();
}

function name(k){ return AGENTS.find(a=>a.key===k).name; }

function log(html){
  const box = document.getElementById('log');
  box.innerHTML = `<div>${html}</div>` + box.innerHTML;
}

function render(){
  document.getElementById('round').textContent = S.round;
  document.getElementById('power').textContent = S.power - (S.alloc.study+S.alloc.life+S.alloc.social);
  document.getElementById('sat').textContent = S.sat;
  document.getElementById('satBar').style.width = S.sat + '%';
  document.getElementById('satBar').style.background = S.sat > 60 ? '#4caf50' : S.sat > 30 ? '#ff9800' : '#f44336';

  document.getElementById('eventBox').innerHTML =
    `<h3>📢 ${S.event.t}<span class="tag">建议：${name(S.event.tag)}</span></h3>
     <p>${S.event.d}</p><p style="margin-top:6px">处理该事件建议投入 <b>${S.event.need}</b> 点算力</p>`;

  const total = S.alloc.study + S.alloc.life + S.alloc.social;
  document.getElementById('agents').innerHTML = AGENTS.map(a => `
    <div class="card ${S.alloc[a.key]>0?'on':''}">
      <div class="ico">${a.icon}</div>
      <h4>${a.name}</h4>
      <div class="desc">${a.desc}</div>
      <div class="ctrl">
        <button onclick="change('${a.key}',-10)" ${S.alloc[a.key]<10?'disabled':''}>-</button>
        <span>${S.alloc[a.key]}</span>
        <button onclick="change('${a.key}',10)" ${total>=S.power?'disabled':''}>+</button>
      </div>
      <div style="font-size:12px;color:#999;margin-top:6px">点击 ±10 点算力</div>
    </div>`).join('');
}

reset();
</script>
</body>
</html>
